<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama da arquitetura do VivaBairro</title>
  <desc id="desc">Diagrama que mostra usuário, frontend web, backend e seus serviços, banco de dados, armazenamento, notificações e integração opcional de IA.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#286A72"/>
    </marker>
    <style>
      .bg{fill:#F1F4F8}.card{fill:#fff;stroke:#D8E0EA;stroke-width:2}.main{fill:#E4F3F1;stroke:#286A72;stroke-width:2}.ai{fill:#FFF0E8;stroke:#E47A43;stroke-width:2}.title{font:700 27px Arial,sans-serif;fill:#14253D}.head{font:700 17px Arial,sans-serif;fill:#14253D}.body{font:400 13px Arial,sans-serif;fill:#344054}.small{font:400 11px Arial,sans-serif;fill:#687688}.flow{fill:none;stroke:#286A72;stroke-width:3;marker-end:url(#arrow)}.flowai{fill:none;stroke:#E47A43;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}.pill{fill:#286A72}.pilltext{font:700 12px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text x="52" y="55" class="title">VivaBairro · arquitetura conceitual</text>
  <text x="52" y="82" class="small">Site responsivo · chamadas HTTPS/JSON · integração de IA opcional e protegida pelo backend</text>

  <rect x="50" y="300" width="190" height="150" rx="20" class="card"/>
  <text x="145" y="344" text-anchor="middle" class="head">Pessoa usuária</text>
  <text x="145" y="374" text-anchor="middle" class="body">Morador · organizador</text>
  <text x="145" y="397" text-anchor="middle" class="body">moderador municipal</text>
  <text x="145" y="427" text-anchor="middle" class="small">Navegador celular ou desktop</text>

  <rect x="305" y="270" width="230" height="210" rx="20" class="main"/>
  <text x="420" y="310" text-anchor="middle" class="head">Frontend web</text>
  <text x="420" y="340" text-anchor="middle" class="body">Interface responsiva</text>
  <text x="420" y="364" text-anchor="middle" class="body">Feed · busca · formulários</text>
  <text x="420" y="388" text-anchor="middle" class="body">Perfil · painel de moderação</text>
  <rect x="365" y="420" width="110" height="30" rx="15" class="pill"/>
  <text x="420" y="440" text-anchor="middle" class="pilltext">HTTPS / JSON</text>

  <rect x="605" y="130" width="330" height="500" rx="20" class="card"/>
  <text x="770" y="170" text-anchor="middle" class="head">Backend / API</text>
  <rect x="635" y="195" width="270" height="70" rx="13" class="main"/>
  <text x="770" y="224" text-anchor="middle" class="body">Autenticação e RBAC</text>
  <text x="770" y="246" text-anchor="middle" class="small">Permissões verificadas no servidor</text>
  <rect x="635" y="285" width="270" height="88" rx="13" class="main"/>
  <text x="770" y="316" text-anchor="middle" class="body">Serviços de domínio</text>
  <text x="770" y="339" text-anchor="middle" class="small">Atividades · avisos · respostas</text>
  <text x="770" y="357" text-anchor="middle" class="small">denúncias · moderação territorial</text>
  <rect x="635" y="393" width="270" height="78" rx="13" class="ai"/>
  <text x="770" y="425" text-anchor="middle" class="body">Adaptador de IA opcional</text>
  <text x="770" y="449" text-anchor="middle" class="small">Valida entrada, saída e timeout</text>
  <rect x="635" y="491" width="270" height="78" rx="13" class="main"/>
  <text x="770" y="523" text-anchor="middle" class="body">Busca e notificações</text>
  <text x="770" y="547" text-anchor="middle" class="small">Feed por bairro · e-mail</text>

  <rect x="1000" y="150" width="230" height="130" rx="20" class="card"/>
  <text x="1115" y="195" text-anchor="middle" class="head">Banco relacional</text>
  <text x="1115" y="226" text-anchor="middle" class="body">Contas · bairros</text>
  <text x="1115" y="250" text-anchor="middle" class="body">eventos · avisos</text>

  <rect x="1000" y="345" width="230" height="110" rx="20" class="card"/>
  <text x="1115" y="386" text-anchor="middle" class="head">Auditoria</text>
  <text x="1115" y="417" text-anchor="middle" class="body">Ações de moderação</text>

  <rect x="1000" y="520" width="230" height="110" rx="20" class="card"/>
  <text x="1115" y="561" text-anchor="middle" class="head">Arquivos</text>
  <text x="1115" y="592" text-anchor="middle" class="body">Fotos opcionais</text>

  <rect x="605" y="690" width="300" height="86" rx="18" class="ai"/>
  <text x="755" y="727" text-anchor="middle" class="head">API externa de IA</text>
  <text x="755" y="752" text-anchor="middle" class="small">Sugere categoria e resumo; não publica</text>

  <rect x="1000" y="690" width="230" height="86" rx="18" class="card"/>
  <text x="1115" y="727" text-anchor="middle" class="head">E-mail / notificações</text>
  <text x="1115" y="752" text-anchor="middle" class="small">Avisos e lembretes opcionais</text>

  <path d="M240 375 H295" class="flow"/>
  <path d="M535 375 H590" class="flow"/>
  <path d="M935 220 H990" class="flow"/>
  <path d="M935 330 C965 330 970 400 990 400" class="flow"/>
  <path d="M935 540 H990" class="flow"/>
  <path d="M770 635 V680" class="flowai"/>
  <path d="M905 535 C960 535 950 730 990 730" class="flow"/>

  <text x="52" y="785" class="small">Dados do rascunho só seguem à IA após consentimento; a pessoa revisa e confirma antes de publicar.</text>
</svg>
