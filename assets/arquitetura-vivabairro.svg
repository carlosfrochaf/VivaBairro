<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura proposta do VivaBairro em containers</title>
  <desc id="desc">Visão técnica proposta: pessoas usam o site responsivo, que acessa uma API. A API lê e grava no banco, guarda fotos opcionalmente e chama serviços externos de e-mail e IA. A chamada de IA só ocorre após consentimento. Tecnologias ainda não escolhidas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#286A72"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#BB5B34"/></marker>
    <style>
      .bg{fill:#F4F6F8}.ink{fill:#173047;font-family:Arial,sans-serif}.muted{fill:#566978;font-family:Arial,sans-serif}.title{font-size:32px;font-weight:700}.subtitle{font-size:17px}.heading{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.boundary{fill:#E9F2F2;stroke:#286A72;stroke-width:2;stroke-dasharray:9 7}.external{fill:#FFF9F5;stroke:#BB5B34;stroke-width:2;stroke-dasharray:8 6}.container{fill:#fff;stroke:#286A72;stroke-width:2}.storage{fill:#fff;stroke:#173047;stroke-width:2}.flow{stroke:#286A72;stroke-width:3;fill:none;marker-end:url(#arrow)}.aiflow{stroke:#BB5B34;stroke-width:3;fill:none;marker-end:url(#arrow2)}.label{fill:#F4F6F8;stroke:#CAD4DB;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1480" height="900"/>
  <text x="52" y="62" class="ink title">Como o VivaBairro pode ser organizado</text>
  <text x="52" y="94" class="muted subtitle">Visão de containers proposta · serviços e tecnologias ainda precisam ser escolhidos</text>

  <rect x="55" y="160" width="280" height="132" rx="14" class="container"/>
  <text x="78" y="196" class="ink heading">Pessoas</text>
  <text x="78" y="226" class="muted body">Moradores e organizadores</text>
  <text x="78" y="251" class="muted body">Equipe municipal e moderadores</text>

  <rect x="55" y="380" width="280" height="128" rx="14" class="external"/>
  <text x="78" y="418" class="ink heading">Provedor de e-mail</text>
  <text x="78" y="448" class="muted body">Serviço externo opcional</text>
  <text x="78" y="474" class="muted small">Entrega notificações configuradas</text>

  <rect x="55" y="610" width="280" height="150" rx="14" class="external"/>
  <text x="78" y="648" class="ink heading">Provedor de IA</text>
  <text x="78" y="678" class="muted body">Serviço externo opcional</text>
  <text x="78" y="705" class="muted small">Recebe rascunho só após consentimento</text>
  <text x="78" y="729" class="muted small">Devolve sugestões; não publica</text>

  <rect x="385" y="142" width="1040" height="650" rx="20" class="boundary"/>
  <text x="414" y="180" class="ink heading">Sistema VivaBairro</text>
  <text x="414" y="206" class="muted small">Limite de responsabilidade do produto</text>

  <rect x="435" y="280" width="270" height="176" rx="14" class="container"/>
  <text x="460" y="320" class="ink heading">Site responsivo</text>
  <text x="460" y="352" class="muted body">Feed, busca e perfis</text>
  <text x="460" y="379" class="muted body">Eventos, avisos e painéis</text>
  <text x="460" y="422" class="muted small">Navegador · interface</text>

  <rect x="790" y="252" width="310" height="235" rx="14" class="container"/>
  <text x="818" y="292" class="ink heading">API e regras do produto</text>
  <text x="818" y="326" class="muted body">Sessões e autorização territorial</text>
  <text x="818" y="354" class="muted body">Eventos, avisos e participações</text>
  <text x="818" y="382" class="muted body">Denúncias e auditoria</text>
  <text x="818" y="410" class="muted body">Busca e notificações</text>
  <text x="818" y="458" class="muted small">Tecnologia de backend a decidir</text>

  <rect x="1170" y="254" width="210" height="156" rx="14" class="storage"/>
  <text x="1194" y="292" class="ink heading">Banco de dados</text>
  <text x="1194" y="324" class="muted body">Contas, bairros</text>
  <text x="1194" y="351" class="muted body">Eventos, avisos</text>
  <text x="1194" y="378" class="muted body">Permissões e histórico</text>

  <rect x="1170" y="467" width="210" height="116" rx="14" class="storage"/>
  <text x="1194" y="507" class="ink heading">Fotos</text>
  <text x="1194" y="538" class="muted body">Armazenamento opcional</text>
  <text x="1194" y="562" class="muted small">Acesso controlado</text>

  <path d="M335 222H420" class="flow"/>
  <rect x="342" y="189" width="75" height="24" rx="6" class="label"/>
  <text x="379" y="206" text-anchor="middle" class="ink small">HTTPS</text>

  <path d="M705 350H775" class="flow"/>
  <rect x="700" y="305" width="104" height="42" rx="6" class="label"/>
  <text x="752" y="322" text-anchor="middle" class="ink small">HTTPS</text>
  <text x="752" y="339" text-anchor="middle" class="ink small">JSON</text>

  <path d="M1100 320H1155" class="flow"/>
  <rect x="1091" y="276" width="94" height="38" rx="6" class="label"/>
  <text x="1138" y="292" text-anchor="middle" class="ink small">Consulta /</text>
  <text x="1138" y="307" text-anchor="middle" class="ink small">gravação</text>

  <path d="M1100 431C1134 431 1135 520 1155 520" class="flow"/>
  <rect x="1065" y="488" width="120" height="24" rx="6" class="label"/>
  <text x="1125" y="505" text-anchor="middle" class="ink small">Upload / leitura</text>

  <path d="M790 410C650 410 632 444 350 444" class="flow"/>
  <rect x="544" y="415" width="154" height="24" rx="6" class="label"/>
  <text x="621" y="432" text-anchor="middle" class="ink small">E-mail configurado</text>

  <path d="M790 462C634 462 646 682 350 682" class="aiflow"/>
  <rect x="489" y="567" width="185" height="40" rx="6" class="label"/>
  <text x="581" y="584" text-anchor="middle" class="ink small">Título + descrição</text>
  <text x="581" y="600" text-anchor="middle" class="ink small">após consentimento</text>
  <path d="M350 722C619 722 627 484 790 484" class="aiflow"/>
  <rect x="478" y="736" width="194" height="24" rx="6" class="label"/>
  <text x="575" y="753" text-anchor="middle" class="ink small">Categoria + resumo sugeridos</text>

  <line x1="420" y1="835" x2="470" y2="835" class="flow"/>
  <text x="483" y="840" class="muted small">Conexão dentro do produto</text>
  <line x1="720" y1="835" x2="770" y2="835" class="aiflow"/>
  <text x="783" y="840" class="muted small">Chamada para serviço externo</text>
  <text x="52" y="872" class="muted small">A trilha de auditoria é dado do sistema, não uma ferramenta separada. Tecnologias, provedor de IA e serviço de e-mail estão pendentes de decisão.</text>
</svg>
