name: Aplicativo e API
on:
  push:
    branches: [main, desenvolvimento-mobile]
    paths: ['api/**', 'mobile/**', '.github/workflows/mobile-api.yml']
  pull_request:
    paths: ['api/**', 'mobile/**', '.github/workflows/mobile-api.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vivabairro_test
          POSTGRES_USER: vivabairro
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vivabairro -d vivabairro_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql://vivabairro:ci-only-password@127.0.0.1:5432/vivabairro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
