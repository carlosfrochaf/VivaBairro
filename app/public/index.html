<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14253d" />
    <title>VivaBairro · Versão Alfa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/estilo.css" />
    <script type="module" src="/app.js"></script>

    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <p class="faixa-demo" role="note">Versão Alfa · dados fictícios de demonstração · IA simulada</p>

      <nav class="navegacao" aria-label="Navegação principal" hidden>
        <a href="#/inicio" data-rota="inicio"><span aria-hidden="true">⌂</span>Início</a>
        <a href="#/publicar" data-rota="publicar"><span aria-hidden="true">＋</span>Publicar</a>
        <a href="#/perfil" data-rota="perfil"><span aria-hidden="true">○</span>Meu perfil</a>
