<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14253d" />
    <title>VivaBairro · Versão Alfa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/estilo.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <p class="faixa-demo" role="note">Versão Alfa · dados fictícios de demonstração · IA simulada</p>
    <div class="tela">
      <header class="topo" hidden>
        <a href="#/inicio" class="marca">VivaBairro</a>
        <div class="topo-acoes">
          <a href="#/bairro" class="bairro-ativo" id="bairro-ativo" title="Trocar bairro"></a>
          <a href="#/notificacoes" class="sino" id="sino" aria-label="Lembretes">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2Zm4 4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="contador" id="contador" hidden></span>
          </a>
        </div>
      </header>
      <main id="conteudo" tabindex="-1"></main>
      <nav class="navegacao" aria-label="Navegação principal" hidden>
        <a href="#/inicio" data-rota="inicio"><span aria-hidden="true">⌂</span>Início</a>
        <a href="#/publicar" data-rota="publicar"><span aria-hidden="true">＋</span>Publicar</a>
        <a href="#/perfil" data-rota="perfil"><span aria-hidden="true">○</span>Meu perfil</a>
      </nav>
    </div>
    <div id="aviso-tela" class="aviso-tela" role="status" aria-live="polite"></div>
  </body>
</html>
