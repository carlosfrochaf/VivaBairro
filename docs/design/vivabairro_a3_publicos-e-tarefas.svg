<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="740" viewBox="0 0 1320 740" role="img" aria-labelledby="title desc">
  <title id="title">Públicos e tarefas previstas para o VivaBairro</title>
  <desc id="desc">Três grupos provisórios: moradores, organizadores e equipes municipais. Cada cartão lista tarefas do produto e perguntas ainda sem resposta. O conteúdo não representa pesquisa concluída.</desc>
  <defs>
    <style>
      .bg{fill:#F4F6F8}.card{fill:#fff;stroke:#C9D4DB;stroke-width:2}.ink{fill:#173047;font-family:Arial,sans-serif}.muted{fill:#566978;font-family:Arial,sans-serif}.teal{fill:#286A72;font-family:Arial,sans-serif}.orange{fill:#BB5B34;font-family:Arial,sans-serif}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px}.head{font-size:21px;font-weight:700}.label{font-size:12px;font-weight:700;letter-spacing:.5px}.body{font-size:15px}.small{font-size:13px}.rule{stroke:#D8E0E4;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1320" height="740"/>
  <text x="48" y="58" class="ink title">Públicos e tarefas do VivaBairro</text>
  <text x="48" y="88" class="muted subtitle">Segmentos de trabalho · hipóteses a validar com pessoas dos bairros escolhidos</text>

  <g transform="translate(48 132)">
    <rect width="390" height="520" rx="12" class="card"/>
    <rect width="390" height="7" rx="4" fill="#286A72"/>
    <text x="26" y="50" class="teal label">PÚBLICO PROVISÓRIO</text>
    <text x="26" y="88" class="ink head">Moradores e frequentadores</text>
    <line x1="26" y1="111" x2="364" y2="111" class="rule"/>
    <text x="26" y="148" class="muted label">TAREFAS QUE O SITE PODE APOIAR</text>
    <text x="26" y="184" class="ink body">• Encontrar eventos por bairro e data</text>
    <text x="26" y="215" class="ink body">• Acompanhar se um aviso continua aberto</text>
    <text x="26" y="246" class="ink body">• Pedir ou oferecer ajuda</text>
    <text x="26" y="277" class="ink body">• Controlar bairro e notificações</text>
    <line x1="26" y1="307" x2="364" y2="307" class="rule"/>
    <text x="26" y="345" class="orange label">PERGUNTAS SEM RESPOSTA</text>
    <text x="26" y="380" class="muted body">Onde as pessoas procuram isso hoje?</text>
    <text x="26" y="411" class="muted body">Que dados preferem não compartilhar?</text>
    <text x="26" y="472" class="muted small">Ainda sem entrevista ou dado de uso registrado.</text>
  </g>

  <g transform="translate(465 132)">
    <rect width="390" height="520" rx="12" class="card"/>
    <rect width="390" height="7" rx="4" fill="#E58A5B"/>
    <text x="26" y="50" class="teal label">PÚBLICO PROVISÓRIO</text>
    <text x="26" y="88" class="ink head">Organizadores locais</text>
    <line x1="26" y1="111" x2="364" y2="111" class="rule"/>
    <text x="26" y="148" class="muted label">TAREFAS QUE O SITE PODE APOIAR</text>
    <text x="26" y="184" class="ink body">• Publicar objetivo, horário e local</text>
    <text x="26" y="215" class="ink body">• Informar vagas ou custo</text>
    <text x="26" y="246" class="ink body">• Avisar quem confirmou sobre mudanças</text>
    <text x="26" y="277" class="ink body">• Atualizar ou cancelar o evento</text>
    <line x1="26" y1="307" x2="364" y2="307" class="rule"/>
    <text x="26" y="345" class="orange label">PERGUNTAS SEM RESPOSTA</text>
    <text x="26" y="380" class="muted body">Como divulgam e controlam presenças?</text>
    <text x="26" y="411" class="muted body">Que informação precisam dos participantes?</text>
    <text x="26" y="472" class="muted small">Ainda sem validação com organizadores.</text>
  </g>

  <g transform="translate(882 132)">
    <rect width="390" height="520" rx="12" class="card"/>
    <rect width="390" height="7" rx="4" fill="#173047"/>
    <text x="26" y="50" class="teal label">PÚBLICO PROVISÓRIO</text>
    <text x="26" y="88" class="ink head">Equipes municipais</text>
    <line x1="26" y1="111" x2="364" y2="111" class="rule"/>
    <text x="26" y="148" class="muted label">TAREFAS QUE O SITE PODE APOIAR</text>
    <text x="26" y="184" class="ink body">• Manter bairros e designações</text>
    <text x="26" y="215" class="ink body">• Publicar comunicados identificados</text>
    <text x="26" y="246" class="ink body">• Analisar denúncias do próprio escopo</text>
    <text x="26" y="277" class="ink body">• Registrar resposta e revisão</text>
    <line x1="26" y1="307" x2="364" y2="307" class="rule"/>
    <text x="26" y="345" class="orange label">PERGUNTAS SEM RESPOSTA</text>
    <text x="26" y="380" class="muted body">Quem autoriza e cobre cada função?</text>
    <text x="26" y="411" class="muted body">Como as demandas chegam ao órgão?</text>
    <text x="26" y="472" class="muted small">Nenhum órgão ou parceria foi confirmado.</text>
  </g>
  <text x="48" y="702" class="muted small">Não são depoimentos nem resultados de pesquisa. Revisar os segmentos e as tarefas depois de conversar com possíveis usuários.</text>
</svg>
