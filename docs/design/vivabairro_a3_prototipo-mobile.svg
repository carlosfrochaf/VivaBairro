<svg xmlns="http://www.w3.org/2000/svg" width="1419" height="1970" viewBox="0 0 1419 1970" role="img" aria-labelledby="title desc">
<title id="title">Fluxos mobile do VivaBairro</title><desc id="desc">Seis telas propostas: entrada, feed, detalhe e confirmação de evento, criação de aviso e perfil. Os nomes, lugares e contagens são dados fictícios; este SVG é um protótipo, não uma aplicação em funcionamento.</desc><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14253D"/><stop offset="1" stop-color="#286A72"/></linearGradient><linearGradient id="cardA"><stop stop-color="#FFB36B"/><stop offset="1" stop-color="#FF765F"/></linearGradient><linearGradient id="cardB"><stop stop-color="#9ADAC4"/><stop offset="1" stop-color="#4B9BA2"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14253D" flood-opacity=".15"/></filter><style>.scr{fill:#FBFCFE;stroke:#D8E0EA;stroke-width:2}.title{font:800 27px Inter,Arial;fill:#14253D}.h2{font:800 19px Inter,Arial;fill:#14253D}.body{font:400 13px Inter,Arial;fill:#687688}.dark{font:500 13px Inter,Arial;fill:#22354D}.small{font:700 10px Inter,Arial;fill:#687688}.white{font:800 13px Inter,Arial;fill:#fff}.label{font:800 10px Inter,Arial;fill:#286A72;letter-spacing:1px}.light{font:400 13px Inter,Arial;fill:#E8F5F4}.nav{font:700 10px Inter,Arial;fill:#687688}</style></defs>
<rect width="1419" height="1970" fill="#F1F4F8"/><text x="60" y="54" font-family="Inter,Arial" font-size="28" font-weight="800" fill="#14253D">VivaBairro · fluxos mobile</text><text x="60" y="82" font-family="Inter,Arial" font-size="14" fill="#687688">Eventos, avisos e colaboração por bairro</text><text x="60" y="114" class="label">DADOS DE DEMONSTRAÇÃO · EXEMPLOS FICTÍCIOS</text>
<!-- 01 --> <g id="01_BoasVindas" transform="translate(60 150)" filter="url(#shadow)"><rect width="393" height="852" rx="28" fill="url(#hero)"/><text x="32" y="46" class="light">01 · BOAS-VINDAS</text><circle cx="196" cy="188" r="44" fill="#FFD166"/><path d="M172 193c17-31 30-32 48 0M176 202h40M184 178v-17M208 178v-17" fill="none" stroke="#14253D" stroke-width="5" stroke-linecap="round"/><text x="196" y="292" text-anchor="middle" font-family="Inter,Arial" font-size="26" font-weight="800" fill="#fff">VivaBairro</text><text x="196" y="332" text-anchor="middle" font-family="Inter,Arial" font-size="21" font-weight="800" fill="#fff">Veja o que acontece no bairro.</text><text x="196" y="360" text-anchor="middle" class="light">Eventos, avisos e iniciativas locais.</text><rect x="32" y="500" width="329" height="56" rx="16" fill="#FFD166"/><text x="196" y="535" text-anchor="middle" font-family="Inter,Arial" font-size="13" font-weight="800" fill="#14253D">Entrar</text><rect x="32" y="575" width="329" height="56" rx="16" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".35"/><text x="196" y="610" text-anchor="middle" class="white">Criar conta</text><text x="196" y="736" text-anchor="middle" class="light">Escolha um bairro para começar.</text></g>
<!-- 02 --> <g id="02_Inicio" transform="translate(513 150)" filter="url(#shadow)"><rect class="scr" width="393" height="852" rx="28"/><text x="22" y="48" font-family="Inter,Arial" font-size="21" font-weight="800" fill="#286A72">VivaBairro</text><circle cx="350" cy="40" r="18" fill="#E5F1F1"/><text x="350" y="46" text-anchor="middle" font-size="17" fill="#286A72">⌕</text><text x="22" y="112" class="title">Olá!</text><text x="22" y="139" class="body">Bairro selecionado · Jardim Aurora</text><rect x="20" y="166" width="353" height="116" rx="18" fill="#E4F3F1"/><text x="40" y="198" class="label">NESTA SEMANA</text><text x="40" y="227" class="h2">Próximas atividades</text><text x="40" y="252" class="body">Eventos no bairro selecionado.</text><rect x="20" y="320" width="167" height="175" rx="16" fill="#fff" stroke="#DCE4EC"/><rect x="32" y="332" width="143" height="78" rx="12" fill="url(#cardA)"/><text x="32" y="438" class="h2">Mutir&#227;o da pra&#231;a</text><text x="32" y="461" class="small">S&#225;b · 9h · 18 confirmados</text><rect x="32" y="469" width="76" height="20" rx="10" fill="#FFE9D8"/><text x="70" y="483" text-anchor="middle" class="small">AO AR LIVRE</text><rect x="206" y="320" width="167" height="175" rx="16" fill="#fff" stroke="#DCE4EC"/><rect x="218" y="332" width="143" height="78" rx="12" fill="url(#cardB)"/><text x="218" y="438" class="h2">Aula de horta</text><text x="218" y="461" class="small">Dom · 10h · 6 vagas</text><rect x="218" y="469" width="70" height="20" rx="10" fill="#DFF5E9"/><text x="253" y="483" text-anchor="middle" class="small">GRATUITO</text><text x="20" y="548" class="h2">Avisos do bairro</text><rect x="20" y="570" width="353" height="76" rx="15" fill="#fff" stroke="#DCE4EC"/><circle cx="49" cy="608" r="18" fill="#FFF0D9"/><text x="49" y="614" text-anchor="middle" font-size="17" fill="#E47A43">!</text><text x="80" y="602" class="dark">Luz apagada na Rua das Ac&#225;cias</text><text x="80" y="624" class="small">Publicado por morador · h&#225; 1 h</text><g transform="translate(0 760)"><line x2="393" stroke="#DCE4EC"/><text x="70" y="35" text-anchor="middle" class="nav" fill="#286A72">⌂</text><text x="70" y="52" text-anchor="middle" class="nav" fill="#286A72">In&#237;cio</text><text x="196" y="35" text-anchor="middle" class="nav">＋</text><text x="196" y="52" text-anchor="middle" class="nav">Publicar</text><text x="323" y="35" text-anchor="middle" class="nav">○</text><text x="323" y="52" text-anchor="middle" class="nav">Meu perfil</text></g></g>
<!-- 03 --> <g id="03_DetalheAtividade" transform="translate(966 150)" filter="url(#shadow)"><rect class="scr" width="393" height="852" rx="28"/><rect width="393" height="270" rx="28" fill="url(#cardA)"/><text x="22" y="45" class="white">‹  Voltar</text><circle cx="330" cy="102" r="45" fill="#FFD166" opacity=".7"/><path d="M20 236c70-42 123-4 180-35 63-35 108-2 193-49v118H20Z" fill="#E47A43" opacity=".4"/><text x="22" y="316" class="label">ATIVIDADE · JARDIM AURORA</text><text x="22" y="352" class="title">Mutir&#227;o da Pra&#231;a do Sol</text><text x="22" y="380" class="body">S&#225;bado, 24 de outubro · 9h &#224;s 12h</text><line x1="22" y1="407" x2="371" y2="407" stroke="#DCE4EC"/><text x="22" y="441" class="h2">Vamos deixar a pra&#231;a mais viva?</text><text x="22" y="470" class="dark">A comunidade vai plantar mudas, pintar os bancos</text><text x="22" y="491" class="dark">e organizar um cantinho para as crian&#231;as.</text><rect x="22" y="532" width="349" height="78" rx="16" fill="#E4F3F1"/><text x="42" y="560" class="small">PONTO DE ENCONTRO</text><text x="42" y="585" class="dark">Coreto da Pra&#231;a do Sol · 18 pessoas j&#225; v&#227;o</text><text x="337" y="578" text-anchor="middle" font-size="23" fill="#286A72">⌖</text><rect x="22" y="646" width="349" height="56" rx="16" fill="#286A72"/><text x="196" y="681" text-anchor="middle" class="white">Quero participar</text><text x="196" y="748" text-anchor="middle" class="body">Voc&#234; recebe um lembrete um dia antes.</text></g>
<!-- 04 --> <g id="04_Confirmacao" transform="translate(60 1080)" filter="url(#shadow)"><rect class="scr" width="393" height="852" rx="28"/><text x="22" y="45" class="dark">‹  In&#237;cio</text><circle cx="196" cy="180" r="58" fill="#DFF5E9"/><circle cx="196" cy="180" r="38" fill="#286A72"/><path d="m178 180 12 12 26-29" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="196" y="293" text-anchor="middle" class="title">Inscri&#231;&#227;o confirmada!</text><text x="196" y="322" text-anchor="middle" class="body">Seu lugar no mutir&#227;o est&#225; reservado.</text><rect x="22" y="376" width="349" height="112" rx="18" fill="#fff" stroke="#DCE4EC"/><text x="42" y="407" class="label">SUA PR&#211;XIMA ATIVIDADE</text><text x="42" y="439" class="h2">Mutir&#227;o da Pra&#231;a do Sol</text><text x="42" y="464" class="body">S&#225;bado · 24/10 · 9h</text><rect x="22" y="533" width="349" height="56" rx="16" fill="#286A72"/><text x="196" y="568" text-anchor="middle" class="white">Ver minhas atividades</text><rect x="22" y="606" width="349" height="56" rx="16" fill="#fff" stroke="#286A72"/><text x="196" y="641" text-anchor="middle" font-family="Inter,Arial" font-size="13" font-weight="800" fill="#14253D">Voltar ao início</text><text x="196" y="726" text-anchor="middle" class="body">Leve uma garrafinha e protetor solar.</text></g>
<!-- 05 --> <g id="05_CriarAviso" transform="translate(513 1080)" filter="url(#shadow)"><rect class="scr" width="393" height="852" rx="28"/><text x="22" y="45" class="dark">‹  In&#237;cio</text><text x="22" y="98" class="title">Criar aviso</text><text x="22" y="126" class="body">Conte algo importante para o bairro.</text><text x="22" y="178" class="small">T&#205;TULO</text><rect x="22" y="192" width="349" height="52" rx="14" fill="#fff" stroke="#D8E0EA"/><text x="42" y="224" class="dark">Ex.: banco quebrado na pra&#231;a</text><text x="22" y="284" class="small">LOCAL</text><rect x="22" y="298" width="349" height="52" rx="14" fill="#fff" stroke="#D8E0EA"/><text x="42" y="330" class="dark">Rua ou ponto de refer&#234;ncia</text><text x="22" y="390" class="small">O QUE ACONTECEU?</text><rect x="22" y="404" width="349" height="118" rx="14" fill="#fff" stroke="#D8E0EA"/><text x="42" y="438" class="body">Explique de um jeito simples para quem</text><text x="42" y="459" class="body">puder ajudar.</text><rect x="22" y="555" width="349" height="90" rx="16" fill="#E4F3F1" stroke="#C8E4E1" stroke-dasharray="6 5"/><text x="196" y="590" text-anchor="middle" font-size="25" fill="#286A72">＋</text><text x="196" y="620" text-anchor="middle" class="dark">Adicionar foto (opcional)</text><rect x="22" y="681" width="349" height="56" rx="16" fill="#FF8A5B"/><text x="196" y="716" text-anchor="middle" font-family="Inter,Arial" font-size="13" font-weight="800" fill="#14253D">Publicar aviso</text></g>
<!-- 06 --> <g id="06_MeuPerfil" transform="translate(966 1080)" filter="url(#shadow)"><rect class="scr" width="393" height="852" rx="28"/><text x="22" y="48" font-family="Inter,Arial" font-size="21" font-weight="800" fill="#286A72">VivaBairro</text><text x="22" y="112" class="title">Meu espa&#231;o</text><circle cx="70" cy="183" r="42" fill="#E4F3F1"/><text x="70" y="192" text-anchor="middle" font-family="Inter,Arial" font-size="23" font-weight="800" fill="#286A72">M</text><text x="130" y="176" class="h2">Perfil de demonstração</text><text x="130" y="202" class="body">Bairro selecionado: Jardim Aurora</text><rect x="22" y="254" width="349" height="1" fill="#DCE4EC"/><text x="80" y="300" text-anchor="middle" class="h2">4</text><text x="80" y="322" text-anchor="middle" class="small">atividades</text><text x="196" y="300" text-anchor="middle" class="h2">2</text><text x="196" y="322" text-anchor="middle" class="small">avisos</text><text x="312" y="300" text-anchor="middle" class="h2">1</text><text x="312" y="322" text-anchor="middle" class="small">bairros</text><text x="22" y="380" class="h2">Pr&#243;ximas atividades</text><rect x="22" y="405" width="349" height="82" rx="16" fill="#fff" stroke="#DCE4EC"/><text x="42" y="437" class="h2">Mutir&#227;o da Pra&#231;a do Sol</text><text x="42" y="462" class="small">24/10 · 9h · Confirmada</text><text x="342" y="451" text-anchor="middle" font-size="23" fill="#286A72">›</text><text x="22" y="548" class="h2">Seus avisos</text><rect x="22" y="572" width="349" height="76" rx="15" fill="#fff" stroke="#DCE4EC"/><text x="42" y="604" class="dark">Luz apagada na Rua das Ac&#225;cias</text><text x="42" y="627" class="small">2 apoios · publicado ontem</text><g transform="translate(0 760)"><line x2="393" stroke="#DCE4EC"/><text x="70" y="35" text-anchor="middle" class="nav">⌂</text><text x="70" y="52" text-anchor="middle" class="nav">In&#237;cio</text><text x="196" y="35" text-anchor="middle" class="nav">＋</text><text x="196" y="52" text-anchor="middle" class="nav">Publicar</text><text x="323" y="35" text-anchor="middle" class="nav" fill="#286A72">○</text><text x="323" y="52" text-anchor="middle" class="nav" fill="#286A72">Meu perfil</text></g></g>
</svg>
